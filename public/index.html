<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Night — Choisis ton jeu</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/base.css" />
  </head>
  <body class="home">
    <header class="home-header">
      <h1>🎉 Game Night</h1>
      <p class="subtitle">La plateforme de mini-jeux a plusieurs</p>
    </header>

    <!-- JOIN section: for a player who received a code from the host -->
    <section class="join-box">
      <h2>Rejoindre une partie</h2>
      <!-- The player's pixel-art avatar: kept on this device, used in every game -->
      <div class="home-avatar">
        <p class="hint" style="margin:0 0 6px">Ton avatar (il te suit dans tous les jeux)</p>
        <div id="avatar-creator"></div>
      </div>
      <form id="join-form">
        <input id="join-code" type="text" maxlength="4" placeholder="CODE" autocomplete="off" />
        <input id="join-name" type="text" maxlength="16" placeholder="Ton pseudo" autocomplete="off" />
        <button type="submit">Rejoindre</button>
      </form>
      <p id="join-hint" class="hint"></p>
    </section>

    <!-- HOST section: the game grid (the "Megapicker") -->
    <section class="host-box">
      <h2>Heberger : choisis un jeu</h2>
      <div id="game-grid" class="game-grid">Chargement des jeux…</div>
    </section>

    <script src="/js/fps-meter.js"></script>
    <!-- every emoji of the page is drawn as pixel art -->
    <script src="/js/pixel-icons.js"></script>
    <script src="/js/pixel-avatar.js"></script>
    <script src="/js/avatar-creator.js"></script>
    <script src="/js/home.js"></script>
  </body>
</html>
