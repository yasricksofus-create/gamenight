<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Night — Salle du host</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/base.css" />
  </head>
  <body class="room">
    <main class="room-main">
      <div id="loading">Création de la salle…</div>

      <!-- The lobby: shown on the host's shared screen -->
      <div id="lobby" class="hidden">
        <header class="room-header">
          <span id="game-emoji" class="room-emoji"></span>
          <h1 id="game-name"></h1>
          <p id="game-tagline" class="subtitle"></p>
        </header>

        <div class="code-block">
          <p class="code-label">Code de la salle</p>
          <p id="room-code" class="room-code">----</p>
          <p class="code-help">
            Tes amis vont sur <strong id="site-url"></strong> et entrent ce code.
          </p>
          <!-- QR code: scanning it opens the join page with the code pre-filled -->
          <div id="join-qr" class="join-qr" aria-label="QR code pour rejoindre"></div>
        </div>

        <section class="players">
          <h2>Joueurs connectés (<span id="player-count">0</span>)</h2>
          <p class="hint" style="margin:4px 0 8px"><img id="host-avatar" class="px-av" width="28" height="28" alt=""> Ton avatar si tu joues aussi :
            <button id="edit-avatar" type="button" class="avatar-edit-btn">Modifier</button></p>
          <ul id="player-list" class="player-list">
            <li class="empty">En attente de joueurs…</li>
          </ul>
        </section>

        <!-- The host-only cheat console. Its buttons are built automatically
             from the current game's declared cheats (see host.js). -->
        <section id="cheat-console" class="cheat-console hidden">
          <h2>🎮 Console de l'host <span class="cheat-hint">cheats de ce jeu</span></h2>
          <div id="cheat-buttons" class="cheat-buttons"></div>
        </section>

        <!-- Start the actual game (works for games that have rules). -->
        <button id="start-btn" class="start-btn hidden">▶ Démarrer la partie</button>
        <p id="start-hint" class="start-hint"></p>
      </div>

      <!-- Where the running game draws itself (filled by the game's script). -->
      <div id="game-root" class="hidden"></div>

      <div id="error" class="hidden error-box"></div>
    </main>

    <button id="leave-btn" class="leave-btn" title="Quitter la salle">← Quitter</button>

    <!-- Socket.IO client library, served automatically by the server -->
    <script src="/js/fps-meter.js"></script>
    <!-- every emoji of the page is drawn as pixel art -->
    <script src="/js/pixel-icons.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <!-- QR code library (tiny, from cdnjs). If it fails to load, no QR is shown. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/js/pixel-avatar.js"></script>
    <script src="/js/avatar-creator.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/effects.js"></script>
    <script src="/js/sound.js"></script>
    <script src="/js/volume-control.js"></script>
    <!-- Loads ONLY the active game's board (games/<id>/client/host.js) on demand. -->
    <script src="/js/clock.js"></script>
    <script src="/js/wakelock.js"></script>
    <script src="/js/connection.js"></script>
    <script src="/js/reactions.js"></script>
    <script src="/js/join-qr.js"></script>
    <script src="/js/game-loader.js"></script>
    <script src="/js/host.js"></script>
    <script src="/js/host-tools.js"></script>
    <script src="/js/feedback.js"></script>
  </body>
</html>
