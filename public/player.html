<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Night — Joueur</title>
    <link rel="stylesheet" href="/css/base.css" />
  </head>
  <body class="room">
    <main class="room-main player-main">
      <div id="loading">Connexion a la salle…</div>

      <!-- Shown once the player is in the room (on their phone) -->
      <div id="connected" class="hidden">
        <header class="room-header">
          <span id="game-emoji" class="room-emoji"></span>
          <h1 id="game-name"></h1>
        </header>
        <p class="you-are">Connecte en tant que <strong id="you-name"></strong></p>
        <div class="waiting-card">
          <p>✅ Tu es dans la salle <strong id="room-code"></strong> !</p>
          <p class="subtitle">Regarde l'ecran du host. La partie va bientot commencer.</p>
        </div>
        <section class="players">
          <h2>Joueurs (<span id="player-count">0</span>)</h2>
          <ul id="player-list" class="player-list"></ul>
        </section>
      </div>

      <div id="error" class="hidden error-box">
        <p id="error-text"></p>
        <a href="/" class="back-link">← Retour a l'accueil</a>
      </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/player.js"></script>
  </body>
</html>
